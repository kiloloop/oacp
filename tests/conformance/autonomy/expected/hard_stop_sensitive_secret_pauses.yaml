# Declared-true auth flag: the secret token demotes and the flag's admission
# pause governs.
case: hard_stop_sensitive_secret_pauses
config: configs/auto_review_standard.yaml
message: messages/sensitive_secret.yaml
expected:
  decision: paused
  mode: auto_review
  reason_codes:
    - auth_config_or_secrets_pause
  logged_notes:
    - matched_pattern: secrets
  co_occurring_reason_codes: []
  result:
    final_state: paused
    completion_kind: admission_paused
