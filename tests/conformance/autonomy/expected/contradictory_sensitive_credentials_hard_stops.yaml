# A PR artifact declared against `external_side_effects: false` is a
# declaration error: the gate trusts none of that profile's flags, so the
# declared-true auth flag does not demote and the token stays a hard stop.
case: contradictory_sensitive_credentials_hard_stops
config: configs/auto_review_standard.yaml
message: messages/contradictory_sensitive_credentials.yaml
expected:
  decision: paused
  mode: auto_review
  reason_codes:
    - hard_stop_sensitive_scope
  matched_pattern: "credentials"
  logged_notes: []
  co_occurring_reason_codes:
    - auth_config_or_secrets_pause
    - declaration_error
    - external_side_effects_not_pr_artifact
  result:
    final_state: paused
    completion_kind: admission_paused
  task_profile:
    touches_auth_config_or_secrets: true
    creates_or_updates_pr: true
