# A complete profile declaring `touches_auth_config_or_secrets: true` routes the
# credential token to the declared flag's own admission pause; the hard stop
# remains for contradictory profiles (see contradictory_credential_rotation).
case: hard_stop_sensitive_credentials_pauses
config: configs/auto_review_standard.yaml
message: messages/sensitive_credentials.yaml
expected:
  decision: paused
  mode: auto_review
  reason_codes:
    - auth_config_or_secrets_pause
  logged_notes:
    - matched_pattern: credentials
  co_occurring_reason_codes: []
  result:
    final_state: paused
    completion_kind: admission_paused
