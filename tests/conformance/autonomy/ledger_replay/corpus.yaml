# Content-sensitivity replay: the reply-only carve-out.
#
# Six anonymized reproductions of every content-sensitivity hard stop the
# same fleet corpus recorded over one two-week window (two mirror-pair
# research briefs sent to two receivers each, one competitive-analysis
# brief, one re-evaluation after a brief amendment) plus one control.
# Every original record carried the single reason code
# hard_stop_content_sensitivity and was cleared by a human unchanged.
#
# Under the reply-only carve-out the category is an advisory for exactly
# one profile shape: a complete profile declaring sends_oacp_reply_only
# true with every other side-effect flag false. Three of the six records
# (cat5-01..03) have that shape and replay with the matched term recorded
# as a lexical_advisory_reply_only note and the verdict taken by the axes
# the hard stop used to mask. The other three (cat5-04..06) declared the
# legacy five-flag profile and omitted sends_oacp_reply_only, so the
# shape is not declared and the hard stop is unchanged. The control
# (cat5-control) declares a commit and stays hard.
#
# Runner: the content-sensitivity tests in tests/test_autonomy_ledger_replay.py.
# recorded_reason_codes is what the original fleet record carried.
content_sensitivity:
  cases:
  - case: cat5-01
    type: brainstorm_request
    body_line: >-
      Literature sweep: the claim that the approach beat eight commercial
      products is secondary and unverified - a lead, not evidence.
