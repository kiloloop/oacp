# Admission-ledger replay corpus.
#
# Twenty-five anonymized reproductions of audit records from a fleet corpus in
# which a structured-predicate replay found envelope-derived admission axes
# that held but went unrecorded — 44 qualitative axes across these records
# plus one masked numeric threshold. Forty-three of the 45 reproduce from the
# evaluator alone (its early returns skipped every axis evaluated after the
# one that drove the verdict); the two on ledger-19 were lost receiver-side
# when a checkpoint update overwrote the admission reasons. Each case carries the
# receiver policy shape, the declared profile, a body line that reproduces the
# recorded primary reason, the pinned verdict, and `expected_axes` — every
# envelope-derived axis that holds for that profile under the policy — plus
# `field_record_missing`, the subset the original record failed to carry.
#
# Runner: tests/test_autonomy_ledger_replay.py. A conforming evaluator records
# every expected axis in `admission_axes` and surfaces every non-primary one
# through `co_occurring_reason_codes`, with the verdict unchanged.
policy:
  max_estimated_minutes: 45
  max_expected_files_touched: 5
  external_side_effects: allow_pr_artifacts
  private_repo_allowlist:
  - example-org/private-repo
cases:
- case: ledger-01
  body_line: Work on the public repo.
  task_profile:
    estimated_minutes: 40
    risk_tier: P2
    expected_files_touched: 12
    destructive_ops: false
    external_side_effects: true
    touches_auth_config_or_secrets: false
    touches_dependencies: false
    public_visibility: false
    target_repo: example-org/private-repo
    creates_or_updates_pr: true
    comments_on_github: true
    commits_changes: true
    merges_pr: true
    files_issues: false
    sends_oacp_reply_only: false
  expected_matched_pattern: public repo
  expected_reason_codes:
  - hard_stop_sensitive_scope
  expected_axes:
  - expected_files_touched_exceeds_threshold
  - merges_pr_pause
  field_record_missing:
