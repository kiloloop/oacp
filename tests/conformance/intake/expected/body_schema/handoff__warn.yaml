    decision: paused
    reason: message_invalid
  skill_and_profile_invalid:
    validation_errors: []
    advisory: true
    decision: paused
    reason: task_profile_unparsable
  skill_and_auth_invalid:
    validation_errors: []
    advisory: true
    decision: paused
    reason: message_invalid
    auth_error: structure
  always_pause_skill_invalid:
    validation_errors: []
    advisory: true
    decision: paused
    reason: mode_always_pause
