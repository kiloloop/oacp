    advisory: false
    decision: paused
    reason: task_profile_unparsable
  bad_grant_shape:
    validation_errors: []
    advisory: false
    decision: paused
    reason: task_profile_unparsable
  missing_required_profile:
    validation_errors: []
    advisory: false
    decision: paused
    reason: task_profile_missing
  unsigned:
    validation_errors: []
    advisory: false
    decision: auto_accepted
    reason: null
  broken_auth:
    validation_errors: []
    advisory: false
    decision: paused
    reason: message_invalid
    auth_error: structure
  nonfinal_auth:
    validation_errors: []
    advisory: false
    decision: auto_accepted
    reason: null
    auth_error: framing
  skill_and_expiry_invalid:
