[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "oacp-cli"
version = "0.5.0"
description = "Open Agent Coordination Protocol CLI for file-based multi-agent workflows"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.9.2"
authors = [
  { name = "Kiloloop" },
]
dependencies = [
  "PyYAML>=6.0",
]
keywords = ["agents", "cli", "coordination", "oacp", "workflow"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
crypto = [
  "cryptography>=50.0.0",
]

[project.urls]
Homepage = "https://github.com/kiloloop/oacp"
Repository = "https://github.com/kiloloop/oacp"
Documentation = "https://github.com/kiloloop/oacp/blob/main/SPEC.md"
Issues = "https://github.com/kiloloop/oacp/issues"

[project.scripts]
oacp = "oacp.cli:main"
oacp-envelope-hook = "oacp.envelope_hook:main"

[dependency-groups]
dev = [
  "build==1.5.0",
  "hatchling==1.27.0",
  "pytest==9.1.1",
  "ruff==0.16.2",
]

[tool.hatch.build.targets.sdist]
exclude = [
  "/.claude",
  "/.codex",
]

[tool.hatch.build.targets.wheel]
packages = ["oacp"]

[tool.hatch.build.targets.wheel.force-include]
"scripts/codex_session_init.py" = "oacp/_scripts/codex_session_init.py"
"scripts/_oacp_constants.py" = "oacp/_scripts/_oacp_constants.py"
"scripts/_oacp_env.py" = "oacp/_scripts/_oacp_env.py"
"scripts/handoff_schema.py" = "oacp/_scripts/handoff_schema.py"
"scripts/oacp_doctor.py" = "oacp/_scripts/oacp_doctor.py"
"scripts/autonomy_gate.py" = "oacp/_scripts/autonomy_gate.py"
"scripts/record_autonomy_outcome.py" = "oacp/_scripts/record_autonomy_outcome.py"
"scripts/finalize_autonomy_record.py" = "oacp/_scripts/finalize_autonomy_record.py"
"scripts/envelope_compiler.py" = "oacp/_scripts/envelope_compiler.py"
"scripts/claude_envelope_hook.py" = "oacp/_scripts/claude_envelope_hook.py"
"scripts/init_project_workspace.py" = "oacp/_scripts/init_project_workspace.py"
"scripts/send_inbox_message.py" = "oacp/_scripts/send_inbox_message.py"
"scripts/message_signing.py" = "oacp/_scripts/message_signing.py"
"scripts/policy_signing.py" = "oacp/_scripts/policy_signing.py"
"scripts/key_cli.py" = "oacp/_scripts/key_cli.py"
"scripts/message_verify.py" = "oacp/_scripts/message_verify.py"
"scripts/trust_root.py" = "oacp/_scripts/trust_root.py"
"scripts/trust_cli.py" = "oacp/_scripts/trust_cli.py"
"scripts/validate_message.py" = "oacp/_scripts/validate_message.py"
"scripts/add_agent.py" = "oacp/_scripts/add_agent.py"
"scripts/agent_profile.py" = "oacp/_scripts/agent_profile.py"
"scripts/oacp_inbox.py" = "oacp/_scripts/oacp_inbox.py"
"scripts/oacp_watch.py" = "oacp/_scripts/oacp_watch.py"
"scripts/retention.py" = "oacp/_scripts/retention.py"
"scripts/setup_runtime.py" = "oacp/_scripts/setup_runtime.py"
"scripts/write_event.py" = "oacp/_scripts/write_event.py"
"scripts/check_quality_gate.py" = "oacp/_scripts/check_quality_gate.py"
"scripts/init_packet.sh" = "oacp/_scripts/init_packet.sh"
"scripts/preflight.py" = "oacp/_scripts/preflight.py"
"scripts/update_workspace.sh" = "oacp/_scripts/update_workspace.sh"
"scripts/validate_agent_card.py" = "oacp/_scripts/validate_agent_card.py"
"scripts/gen_readme_commands.py" = "oacp/_scripts/gen_readme_commands.py"
"docs/protocol/agent_safety_defaults.md" = "oacp/_protocol/agent_safety_defaults.md"
"docs/protocol/dispatch_states.yaml" = "oacp/_protocol/dispatch_states.yaml"
"docs/protocol/session_init.md" = "oacp/_protocol/session_init.md"
"docs/protocol/inbox_outbox.md" = "oacp/_protocol/inbox_outbox.md"
"docs/protocol/message_signing.md" = "oacp/_protocol/message_signing.md"
"docs/protocol/autonomy.md" = "oacp/_protocol/autonomy.md"
"docs/protocol/org_memory.md" = "oacp/_protocol/org_memory.md"
# Preserve ../guides/ links from the shipped protocol documents.
"docs/guides/memory-context.md" = "oacp/guides/memory-context.md"
"templates/inbox_message.template.yaml" = "oacp/_templates/inbox_message.template.yaml"
"templates/runtime_capabilities.yaml" = "oacp/_templates/runtime_capabilities.yaml"
"templates/agent_card.template.yaml" = "oacp/_templates/agent_card.template.yaml"
"templates/agent_profile.template.yaml" = "oacp/_templates/agent_profile.template.yaml"
"templates/receiver_config.template.yaml" = "oacp/_templates/receiver_config.template.yaml"
"templates/agent_status.template.yaml" = "oacp/_templates/agent_status.template.yaml"
"templates/claude/agents/role_agent.template.md" = "oacp/_templates/claude/agents/role_agent.template.md"

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
